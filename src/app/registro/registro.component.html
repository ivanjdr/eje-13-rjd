<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-sm p-4" style="width: 400px; border-radius: 10px;">
    
    <div class="text-center mb-4">
      <h2 class="text-primary fw-bold"><i class="bi bi-shield-lock"></i> AdminLTE</h2>
      <p class="text-muted">Crea tu nueva cuenta</p>
    </div>

    <h6 class="text-center mb-3"><i class="bi bi-person-plus"></i> Registro de nueva membresía</h6>
    
    <div *ngIf="mensaje" class="alert p-2 text-center" [ngClass]="esError ? 'alert-danger' : 'alert-success'">
      {{ mensaje }}
    </div>

    <div class="mb-3 input-group">
      <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
      <input type="text" class="form-control" [(ngModel)]="nombre" placeholder="Nombre completo">
    </div>

    <div class="mb-3 input-group">
      <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
      <input type="email" class="form-control" [(ngModel)]="correo" placeholder="Correo electrónico">
    </div>

    <div class="mb-3 input-group">
      <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
      <input type="password" class="form-control" [(ngModel)]="password" placeholder="Contraseña">
    </div>

    <div class="mb-4 input-group">
      <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
      <input type="password" class="form-control" [(ngModel)]="repetirPassword" placeholder="Repetir contraseña">
    </div>

    <button (click)="registrar()" class="btn btn-primary w-100 mb-4">
      <i class="bi bi-person-plus-fill"></i> Registrar cuenta
    </button>

    <div class="text-center">
      <a routerLink="/login" class="text-decoration-none">Ya tengo una cuenta <i class="bi bi-arrow-right"></i></a>
    </div>

  </div>
</div>
