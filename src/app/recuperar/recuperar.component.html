<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-sm p-4 text-center" style="width: 400px; border-radius: 10px;">
    
    <div class="mb-4">
      <h2 class="text-primary fw-bold"><i class="bi bi-lock-fill"></i> AdminLTE</h2>
      <p class="text-muted">Recupera tu contraseña</p>
    </div>

    <div class="mb-3 text-primary" style="font-size: 3rem;">
      <i class="bi bi-envelope-check-fill"></i>
    </div>

    <h5 class="mb-2">¿Olvidaste tu contraseña?</h5>
    <p class="text-muted small mb-4">No te preocupes, podemos ayudarte a recuperarla fácilmente.</p>

    <div *ngIf="mensaje" class="alert alert-info p-2">
      {{ mensaje }}
    </div>

    <div class="mb-4 input-group">
      <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
      <input type="email" class="form-control" [(ngModel)]="correo" placeholder="Correo electrónico">
    </div>

    <button (click)="recuperar()" class="btn btn-primary w-100 mb-4">
      <i class="bi bi-send"></i> Enviar enlace de recuperación
    </button>

    <div class="d-flex flex-column gap-2 text-start">
      <a routerLink="/login" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Volver al inicio de sesión</a>
      <a routerLink="/registro" class="text-decoration-none"><i class="bi bi-person-plus"></i> Registrar una nueva membresía</a>
    </div>

  </div>
</div>
